name: Update main documentation

on:
  push:
    branches: [main]
    paths:
      - "simulator/**"
      - "rl/**"
      - "main.py"
      - "auto.py"
      - "Makefile"
      - "tests/**"
      - "pyproject.toml"
      - "SPEC.md"
      - "scripts/sim-ab.ps1"
  # Manual run: re-sync the doc on demand without waiting for a qualifying merge.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  # main is protected (ruleset "main-protection": PR + review required, no bypass
  # actors), so the doc lands via a PR from this bot branch rather than a push.
  DOC_BRANCH: bot/doc-sync
  BASE_BRANCH: main

jobs:
  update-doc:
    if: ${{ !startsWith(github.event.head_commit.message, '[docs]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load current doc
        run: |
          # The doc lives on ${BASE_BRANCH}, which is what we just checked out, so the
          # working copy is already the right baseline. Any pending bot-branch edits are
          # intentionally ignored: each run re-syncs from ${BASE_BRANCH}'s committed doc.
          if [[ ! -f docs/main-documentation.md ]]; then
            echo "No docs/main-documentation.md on ${BASE_BRANCH}" >&2
            exit 1
          fi
          echo "Using docs/main-documentation.md from ${BASE_BRANCH} ($(wc -c < docs/main-documentation.md) bytes)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install doc agent deps
        run: npm ci
        working-directory: scripts

      - name: Gather doc context
        run: |
          chmod +x scripts/doc-context.sh scripts/doc-validate.sh
          make doc-context
          echo "MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_SUBJECT=$(git log -1 --format='%s')" >> "$GITHUB_ENV"
          echo "MAIN_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Run Cursor doc agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: node scripts/update-main-documentation.mjs

      - name: Validate documentation
        run: make doc-validate MAIN_SHA="${MAIN_SHA}"

      - name: Open or update doc PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/main-documentation.md; then
            echo "No documentation changes to sync"
            exit 0
          fi

          # Branch off the checked-out ${BASE_BRANCH} commit so the PR carries the doc
          # change alone. -B resets any previous bot branch: each run supersedes the last.
          git checkout -B "${DOC_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/main-documentation.md
          git commit -m "[docs] sync for ${MAIN_SHORT} — ${MAIN_SUBJECT}"
          # Refresh the tracking ref so --force-with-lease compares against reality
          # instead of failing "stale info".
          git fetch origin "${DOC_BRANCH}" || true
          git push --force-with-lease origin "${DOC_BRANCH}"

          # An open PR from this branch picks the new commit up automatically.
          if [[ -n "$(gh pr list --head "${DOC_BRANCH}" --base "${BASE_BRANCH}" --state open --json number --jq '.[].number')" ]]; then
            echo "Updated existing doc PR"
          else
            gh pr create \
              --base "${BASE_BRANCH}" \
              --head "${DOC_BRANCH}" \
              --title "[docs] sync for ${MAIN_SHORT} — ${MAIN_SUBJECT}" \
              --body "Automated \`docs/main-documentation.md\` sync for \`${MAIN_SHORT}\` (${MAIN_SUBJECT}), generated by the Cursor doc agent. Review the diff as usual — \`main\` requires an approving review."
          fi
