[project]
name = "anduril-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.0.0",
    "keyboard>=0.13.5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "opencv-python>=4.13.0.92",
    "pymavlink>=2.4.49",
    "pyyaml>=6.0.3",
    "sb3-contrib>=2.9.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.4.0",
    "tensorboard>=2.21.0",
    "torch>=2.6.0",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.84",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.9",
    "ruff>=0.15.15",
]

# CUDA wheels for torch: YOLO gate detection needs the GPU (CPU inference is
# 100-350 ms/frame -- too slow to track gates at racing speed).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
