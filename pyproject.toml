[project]
name = "anduril-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "filterpy>=1.4.5",
    "gymnasium>=1.0.0",
    "keyboard>=0.13.5",
    "lapx>=0.9.4",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "onnxruntime-gpu>=1.28.0",
    "opencv-python>=4.13.0.92",
    "pymavlink>=2.4.49",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "stable-baselines3>=2.4.0",
    "supervision>=0.29.1",
    "tensorboard>=2.21.0",
    "torch>=2.6.0",
    "torchvision>=0.27.0",
    "ultralytics>=8.4.84",
]

[dependency-groups]
dev = [
    "lefthook>=2.1.9",
    "ruff>=0.15.15",
]

# ekf2/px4/ is upstream PX4 source vendored in for the ecl/EKF2 build -- their
# code, their style. Linting it reports 113 findings we would never fix, and any
# fix we did make would be reverted by the next sync from upstream.
[tool.ruff]
extend-exclude = ["ekf2/px4"]

# CUDA wheels for torch: YOLO gate detection needs the GPU (CPU inference is
# 100-350 ms/frame -- too slow to track gates at racing speed).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
